name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
    - name: Repozitoriyanı yüklə
      uses: actions/checkout@v3

    - name: Python mühitini qur
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Skripti işə sal
      run: python update_playlist.py

    - name: Yenilənmiş faylı avtomatik olaraq repoya əlavə et
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        file_pattern: playlist.m3u
        commit_message: "Auto update playlist"
