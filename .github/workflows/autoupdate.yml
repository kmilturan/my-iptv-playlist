name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
    - name: Repozitoriyanı yüklə
      uses: actions/checkout@v3

    - name: Python mühitini qur
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Skripti işə sal
      run: python update_playlist.py

    - name: Yenilənmiş faylı avtomatik olaraq repoya əlavə et və göndər
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add playlist.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update playlist" && git pull --rebase origin main && git push origin main)
