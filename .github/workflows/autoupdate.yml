name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-22.04

    steps:
    - name: Repozitoriyanı yüklə
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Python mühitini qur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Skripti işə sal
      run: python update_playlist.py

    - name: Git konfiqurasiyası və məcburi göndərmə
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Git-in avtomatik rebase etməsinin qarşısını alırıq
        git config --global pull.rebase false
        
        git add playlist.m3u
        git commit -m "Auto update playlist" || echo "No changes"
        
        # Əgər uzaq qovluqda dəyişiklik varsa, bizim faylı üstün tutaraq birləşdiririk
        git pull origin main --strategy-option theirs --no-rebase || true
        
        git push origin main --force
