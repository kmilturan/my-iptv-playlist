name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-22.04

    steps:
    - name: Repozitoriyanı yüklə
      uses: actions/checkout@v4

    - name: Python mühitini qur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Git konfiqurasiyası
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git pull origin main

    - name: Skripti işə sal
      run: python update_playlist.py

    - name: Yenilənmiş faylı avtomatik olaraq repoya göndər
      run: |
        git add playlist.m3u
        git diff --staged --quiet || (git commit -m "Auto update playlist" && git push origin main)
