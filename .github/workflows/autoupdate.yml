name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-22.04

    steps:
    - name: Repozitoriyanı yüklə
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Python mühitini qur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Skripti işə sal
      run: python update_playlist.py

    - name: Yenilənmiş faylı repoya məcburi göndər
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add playlist.m3u
        git commit -m "Auto update playlist" || echo "No changes to commit"
        git push origin main --force
