name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-22.04

    steps:
    - name: Repozitoriyanı yüklə
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Python mühitini qur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Skripti işə sal
      run: python update_playlist.py

    - name: Repoya məcburi göndər (Konfliktsiz)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git checkout --orphan latest_branch
        git add -A
        git commit -m "Auto update playlist"
        git branch -D main
        git branch -m main
        git push -f origin main
