name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: '0 */2 * * *' # Hər 2 saatdan bir avtomatik işləyir
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'update_playlist.py'
      - 'iptv_validator.py'
      - 'sources.txt'

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-22.04

    steps:
    - name: Repozitoriyanı yüklə
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 1

    - name: Python mühitini qur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: ''

    - name: FFmpeg-i quraşdır (Validator üçün mütləqdir)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: 1. Ana IPTV skriptini işə sal
      run: python update_playlist.py

    - name: 2. Validator skripti ilə playlist.m3u içindəki qırıq linkləri təmizlə
      run: python iptv_validator.py

    - name: Dəyişiklikləri yoxla və göndər
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git status
        git add playlist.m3u
        if [ -f "sources.txt" ]; then git add sources.txt; fi
        git commit -m "Auto update and validate playlist [skip ci]" || echo "No changes to commit"
        git push origin main --force
